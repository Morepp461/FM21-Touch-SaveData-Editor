name: Android build, tests and release candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and release APKs and run unit tests
        run: gradle :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --stacktrace
      - name: Verify Android package compatibility and runtime libraries
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "sdkVersion:'26'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"
          if unzip -l "$APK" | grep -q 'libzstd-jni'; then
            echo "Unexpected Zstandard JNI library found in runtime APK"
            exit 1
          fi
          echo "Minimum SDK 26, target SDK 35, no zstd-jni runtime library."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fm21-touch-save-editor-0.6.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: fm21-touch-save-editor-0.6.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  android-api26-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Launch app and verify home screen on Android 8.0 (API 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86
          profile: pixel_2
          script: gradle :app:connectedDebugAndroidTest --stacktrace
