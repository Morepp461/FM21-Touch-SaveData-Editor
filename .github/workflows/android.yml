name: Android build, tests and release candidate

concurrency:
  group: android-ci-${{ github.sha }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for read-only reverse-engineering tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python diagnostic dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test read-only person-record diagnostics
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare private release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/fm21-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build debug and release APK/AAB and run unit tests
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --stacktrace
      - name: Verify debug and release package compatibility and runtime libraries
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          fi
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          test -f app/build/outputs/bundle/release/app-release.aab
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          for APK in "$DEBUG_APK" "$RELEASE_APK"; do
            PERMISSIONS="$("$AAPT" dump permissions "$APK")"
            if echo "$PERMISSIONS" | grep -q "android.permission.INTERNET"; then
              echo "Unexpected Internet permission in offline-first app package: $APK"
              exit 1
            fi
            BADGING="$("$AAPT" dump badging "$APK")"
            echo "$BADGING" | grep -q "sdkVersion:'26'"
            echo "$BADGING" | grep -q "targetSdkVersion:'36'"
            if ! unzip -l "$APK" | grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libzstd-jni.*\.so'; then
              echo "Android Zstandard native runtime libraries are missing from $APK"
              exit 1
            fi
          done
          echo "Debug and release APKs: minimum SDK 26, target SDK 36, native Zstandard runtime present."
      - name: Generate release checksums and build metadata
        shell: bash
        run: |
          mkdir -p app/build/outputs/release-metadata
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk "$RELEASE_APK" app/build/outputs/bundle/release/app-release.aab > app/build/outputs/release-metadata/SHA256SUMS.txt
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
          BASE_COMMIT="${{ github.event.pull_request.base.sha || '' }}"
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "checked_out_commit=$CHECKED_OUT_COMMIT"
            echo "base_commit=$BASE_COMMIT"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "min_sdk=26"
            echo "target_sdk=36"
          } > app/build/outputs/release-metadata/BUILD-METADATA.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fm21-touch-save-editor-0.8.0-alpha-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/release-metadata/SHA256SUMS.txt
            app/build/outputs/release-metadata/BUILD-METADATA.txt
          if-no-files-found: error
      - name: Upload unsigned release APK and AAB
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fm21-touch-save-editor-0.8.0-alpha-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release-metadata/SHA256SUMS.txt
            app/build/outputs/release-metadata/BUILD-METADATA.txt
          if-no-files-found: error
      - name: Verify signed release APK and AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release APK and AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fm21-touch-save-editor-0.8.0-alpha-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/release-metadata/SHA256SUMS.txt
            app/build/outputs/release-metadata/BUILD-METADATA.txt
          if-no-files-found: error

  android-api26-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Launch app and verify home screen on Android 8.0 (API 26)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86
          profile: pixel_2
          script: gradle :app:connectedDebugAndroidTest --stacktrace
